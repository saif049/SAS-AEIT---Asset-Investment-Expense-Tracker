<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Subtle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Shield Asset Icon Base -->
  <path d="M256 96 L376 156 V264 C376 348 256 416 256 416 C256 416 136 348 136 264 V156 Z" 
        fill="#0f172a" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Internal Finance Growth Wave -->
  <path d="M180 300 L230 250 L270 280 L332 200" 
        fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Arrow Head -->
  <polyline points="308,200 332,200 332,224" 
            fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Taka / Currency Monogram '৳' stylized -->
  <circle cx="210" cy="210" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="336" r="8" fill="#10b981"/>
</svg>
